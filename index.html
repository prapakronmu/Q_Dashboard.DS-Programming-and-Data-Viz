<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Movie Analytics — Vision OS Glassmorphism</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandOrange: '#FF6847',
            glassBg: 'rgba(255, 255, 255, 0.08)',
            glassBorder: 'rgba(255, 255, 255, 0.18)',
            darkGlass: 'rgba(20, 20, 26, 0.65)'
          },
          backdropBlur: {
            '3xl': '40px',
            '4xl': '64px'
          },
          borderRadius: {
            'vision': '24px',
            'vision-lg': '32px'
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM 18, Babel Standalone, Recharts -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>

  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-window {
      background: rgba(25, 25, 32, 0.55);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7);
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .glass-card {
      background: rgba(20, 20, 26, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-input {
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 104, 71, 0.5); border-radius: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body class="bg-black text-white min-h-screen overflow-hidden selection:bg-[#FF6847] selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const { PieChart, Pie, Cell, BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, Label } = window.Recharts || {};

    // --- Helpers ---
    const formatMoney = (val) => {
      if (!val || isNaN(val)) return 'N/A';
      if (val >= 1e9) return `$${(val / 1e9).toFixed(1)}B`;
      if (val >= 1e6) return `$${(val / 1e6).toFixed(0)}M`;
      return `$${val.toLocaleString()}`;
    };

    const formatNumber = (val) => val ? val.toLocaleString() : '0';

    // --- Icons ---
    const IconHome = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
    const IconHeart = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>;
    const IconDownload = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
    const IconUser = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
    const IconSettings = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>;
    const IconSearch = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
    const IconPlay = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>;
    const IconStar = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="#FF6847" stroke="#FF6847"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>;

    // --- Main App Component ---
    function App() {
      const [movies, setMovies] = useState([]);
      const [currentView, setCurrentView] = useState('home'); // 'home' | 'detail'
      const [selectedMovie, setSelectedMovie] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [activeCategory, setActiveCategory] = useState('Movies');
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        fetch('data/processed/movies_clean.json')
          .then(res => res.json())
          .then(data => {
            const sorted = data.sort((a, b) => (b.popularity_score || 0) - (a.popularity_score || 0));
            setMovies(sorted);
            setSelectedMovie(sorted[0]);
            setLoading(false);
          })
          .catch(err => {
            console.error("Data load failed:", err);
            setLoading(false);
          });
      }, []);

      // Filtered movies based on search
      const filteredMovies = useMemo(() => {
        if (!searchQuery) return movies;
        return movies.filter(m => m.title.toLowerCase().includes(searchQuery.toLowerCase()));
      }, [movies, searchQuery]);

      if (loading) {
        return (
          <div className="flex h-screen w-screen items-center justify-center bg-black text-white font-medium tracking-widest uppercase">
            <div className="flex flex-col items-center gap-4">
              <div className="w-12 h-12 border-4 border-[#FF6847] border-t-transparent rounded-full animate-spin"></div>
              <span>Loading Vision OS Dashboard...</span>
            </div>
          </div>
        );
      }

      const activeBgImage = selectedMovie?.backdrop_path || selectedMovie?.poster_path || 
        "https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=2070&auto=format&fit=crop";

      return (
        <div className="relative w-screen h-screen overflow-hidden flex items-center justify-center p-6 sm:p-10">
          
          {/* 1. Cinematic Blurred Backdrop (Persists across all views) */}
          <div className="fixed inset-0 z-0">
            <div 
              className="absolute inset-0 bg-cover bg-center scale-110 transition-all duration-1000 blur-3xl opacity-40"
              style={{ backgroundImage: `url(${activeBgImage})` }}
            ></div>
            <div className="absolute top-[-20%] left-[-10%] w-[50vw] h-[50vw] bg-[#FF6847]/20 rounded-full blur-[140px] pointer-events-none"></div>
            <div className="absolute bottom-[-20%] right-[-10%] w-[60vw] h-[60vw] bg-indigo-900/30 rounded-full blur-[160px] pointer-events-none"></div>
            <div className="absolute inset-0 bg-black/60 backdrop-blur-[60px]"></div>
          </div>

          {/* 2. Main Vision OS Floating Glass Window */}
          <div className="relative z-10 w-full max-w-[1440px] h-full max-h-[880px] glass-window rounded-vision-lg flex overflow-hidden shadow-2xl">
            
            {/* Left Floating Sidebar */}
            <Sidebar currentView={currentView} onNavigate={(view) => setCurrentView(view)} />

            {/* Main Content Area */}
            <div className="flex-1 flex flex-col h-full overflow-hidden">
              
              {/* Global Header */}
              <Header 
                searchQuery={searchQuery} 
                onSearchChange={setSearchQuery} 
                activeCategory={activeCategory} 
                onCategoryChange={setActiveCategory}
                currentView={currentView}
                onNavigate={(v) => setCurrentView(v)}
              />

              {/* View Router */}
              <div className="flex-1 overflow-y-auto p-6 sm:p-8">
                {currentView === 'home' ? (
                  <HomePage 
                    movies={filteredMovies} 
                    onSelectMovie={(movie) => {
                      setSelectedMovie(movie);
                      setCurrentView('detail');
                    }}
                  />
                ) : (
                  <MovieDetailPage 
                    movie={selectedMovie} 
                    allMovies={movies} 
                    onSelectMovie={setSelectedMovie} 
                  />
                )}
              </div>
            </div>

          </div>
        </div>
      );
    }

    // --- Component: Sidebar ---
    function Sidebar({ currentView, onNavigate }) {
      return (
        <div className="w-20 py-8 border-r border-white/10 flex flex-col items-center justify-between bg-black/20">
          <div className="flex flex-col items-center gap-6">
            <button 
              onClick={() => onNavigate('home')} 
              className={`p-3 rounded-full transition-all duration-300 ${currentView === 'home' ? 'bg-[#FF6847] text-white shadow-[0_0_20px_rgba(255,104,71,0.6)] scale-110' : 'text-gray-400 hover:text-white hover:bg-white/10'}`}
              title="Home"
            >
              <IconHome />
            </button>
            <button 
              onClick={() => onNavigate('detail')} 
              className={`p-3 rounded-full transition-all duration-300 ${currentView === 'detail' ? 'bg-[#FF6847] text-white shadow-[0_0_20px_rgba(255,104,71,0.6)] scale-110' : 'text-gray-400 hover:text-white hover:bg-white/10'}`}
              title="Movie Details & Analytics"
            >
              <IconHeart />
            </button>
            <button className="p-3 rounded-full text-gray-400 hover:text-white hover:bg-white/10 transition-all"><IconDownload /></button>
            <button className="p-3 rounded-full text-gray-400 hover:text-white hover:bg-white/10 transition-all"><IconUser /></button>
          </div>
          <div>
            <button className="p-3 rounded-full text-gray-400 hover:text-white hover:bg-white/10 transition-all"><IconSettings /></button>
          </div>
        </div>
      );
    }

    // --- Component: Header ---
    function Header({ searchQuery, onSearchChange, activeCategory, onCategoryChange, currentView, onNavigate }) {
      const categories = ['Movies', 'TV Series', 'Animation', 'Mystery', 'More'];

      return (
        <header className="h-20 border-b border-white/10 px-8 flex items-center justify-between bg-black/10">
          {/* Search Box */}
          <div className="flex items-center gap-3 glass-input px-4 py-2.5 rounded-full w-80 text-gray-300 focus-within:border-[#FF6847]/60 transition-colors">
            <IconSearch />
            <input 
              type="text" 
              placeholder="Search movies..." 
              value={searchQuery}
              onChange={(e) => onSearchChange(e.target.value)}
              className="bg-transparent border-none outline-none text-sm w-full text-white placeholder-gray-400"
            />
          </div>

          {/* Category Tabs */}
          <div className="flex items-center gap-2 bg-black/30 p-1.5 rounded-full border border-white/10">
            {categories.map(cat => (
              <button 
                key={cat}
                onClick={() => onCategoryChange(cat)}
                className={`px-5 py-2 rounded-full text-xs font-semibold transition-all duration-300 ${activeCategory === cat ? 'bg-white/20 text-white border border-white/20 shadow-lg' : 'text-gray-400 hover:text-white'}`}
              >
                {cat}
              </button>
            ))}
          </div>

          {/* User Profile */}
          <div className="flex items-center gap-4">
            <button 
              onClick={() => onNavigate(currentView === 'home' ? 'detail' : 'home')}
              className="text-xs font-bold uppercase tracking-wider text-[#FF6847] hover:underline"
            >
              {currentView === 'home' ? 'Analytics View →' : '← Home View'}
            </button>
            <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-[#FF6847] to-purple-600 border-2 border-white/20 shadow-md"></div>
          </div>
        </header>
      );
    }

    // --- Component: Home Page (Image2.webp Layout) ---
    function HomePage({ movies, onSelectMovie }) {
      const featured = movies[0] || {};
      const trending = movies.slice(1, 15);
      const trailers = movies.slice(15, 18);

      return (
        <div className="flex h-full gap-8 animate-in fade-in duration-500">
          
          {/* Left Column: Trailers & Continue Watching */}
          <div className="w-[32%] flex flex-col gap-6">
            
            {/* New Trailers Section */}
            <div className="flex flex-col gap-4">
              <div className="flex items-center justify-between">
                <h2 className="text-base font-bold tracking-wide flex items-center gap-2">
                  <span className="text-[#FF6847]">🔥</span> New Trailer
                </h2>
                <span className="text-xs text-gray-400">Today 1k</span>
              </div>
              
              <div className="flex flex-col gap-3">
                {trailers.map((m, idx) => (
                  <div 
                    key={m.movie_id || idx}
                    onClick={() => onSelectMovie(m)}
                    className="glass-card rounded-vision p-3 flex gap-3 cursor-pointer hover:border-[#FF6847]/40 hover:scale-[1.02] transition-all duration-300 group"
                  >
                    <div className="w-24 h-16 bg-gray-800 rounded-xl overflow-hidden relative flex-shrink-0">
                      <div className="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent z-10"></div>
                      <div className="absolute inset-0 flex items-center justify-center z-20">
                        <div className="w-8 h-8 rounded-full bg-black/60 backdrop-blur-md flex items-center justify-center text-[#FF6847] group-hover:scale-110 transition-transform">
                          <IconPlay />
                        </div>
                      </div>
                      <div className="w-full h-full bg-gray-700 flex items-center justify-center text-xs font-bold text-gray-500">
                        {m.title?.substring(0, 8)}
                      </div>
                    </div>
                    <div className="flex flex-col justify-center">
                      <h3 className="text-sm font-semibold text-white group-hover:text-[#FF6847] transition-colors line-clamp-1">{m.title}</h3>
                      <p className="text-xs text-gray-400 mt-1">{(m.genres || []).slice(0, 2).join(' • ')}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Continue Watching Card */}
            <div>
              <h2 className="text-base font-bold tracking-wide mb-3">Continue Watching</h2>
              <div 
                onClick={() => movies[1] && onSelectMovie(movies[1])}
                className="glass-card rounded-vision p-4 cursor-pointer hover:border-[#FF6847]/40 transition-all group"
              >
                <div className="flex gap-4 items-center mb-3">
                  <div className="w-12 h-12 rounded-xl bg-gray-700 flex items-center justify-center text-[#FF6847]">
                    <IconPlay />
                  </div>
                  <div>
                    <h3 className="text-sm font-semibold text-white group-hover:text-[#FF6847] transition-colors">{movies[1]?.title || 'Featured Film'}</h3>
                    <p className="text-xs text-gray-400 mt-0.5">Season 1 • Ep 4</p>
                  </div>
                </div>
                <div className="w-full bg-white/10 h-1.5 rounded-full overflow-hidden">
                  <div className="w-3/4 h-full bg-[#FF6847] rounded-full"></div>
                </div>
              </div>
            </div>

          </div>

          {/* Right Main Area: Hero Banner & You Might Like Carousel */}
          <div className="flex-1 flex flex-col gap-6">
            
            {/* Hero Banner */}
            <div 
              onClick={() => onSelectMovie(featured)}
              className="relative w-full h-[52%] glass-panel rounded-vision-lg overflow-hidden p-8 flex flex-col justify-end cursor-pointer group border border-white/20"
            >
              <div className="absolute inset-0 bg-gradient-to-t from-black/95 via-black/40 to-transparent z-10"></div>
              <div className="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=2070&auto=format&fit=crop')] bg-cover bg-center opacity-40 group-hover:scale-105 transition-transform duration-700"></div>
              
              <div className="relative z-20 max-w-xl">
                <div className="flex gap-2 mb-3">
                  {(featured.genres || ['Action', 'Adventure']).map(g => (
                    <span key={g} className="text-[11px] uppercase tracking-wider px-3 py-1 bg-white/15 backdrop-blur-md rounded-full border border-white/20 font-medium">
                      {g}
                    </span>
                  ))}
                </div>
                <h1 className="text-4xl font-extrabold mb-3 text-white drop-shadow-md">{featured.title}</h1>
                <p className="text-xs text-gray-300 line-clamp-2 mb-5 leading-relaxed">{featured.overview}</p>
                
                <div className="flex gap-4">
                  <button className="px-6 py-2.5 bg-[#FF6847] text-white text-xs font-semibold rounded-full flex items-center gap-2 hover:bg-[#FF8469] transition-all shadow-lg shadow-[#FF6847]/30">
                    <IconPlay /> Watch
                  </button>
                  <button className="px-6 py-2.5 bg-white/10 text-white text-xs font-semibold rounded-full hover:bg-white/20 transition-all border border-white/15">
                    + Favorite
                  </button>
                </div>
              </div>
            </div>

            {/* You Might Like Carousel */}
            <div className="flex flex-col gap-3">
              <div className="flex items-center justify-between">
                <h2 className="text-lg font-bold">You Might Like</h2>
                <span className="text-xs text-[#FF6847] font-semibold cursor-pointer hover:underline">See all</span>
              </div>
              
              <div className="flex gap-4 overflow-x-auto pb-2 pt-1 snap-x">
                {trending.map((m, idx) => (
                  <div 
                    key={m.movie_id || idx}
                    onClick={() => onSelectMovie(m)}
                    className="shrink-0 w-44 h-64 glass-card rounded-vision p-3 flex flex-col justify-end cursor-pointer hover:scale-105 hover:border-[#FF6847]/50 transition-all duration-300 snap-start relative group overflow-hidden"
                  >
                    <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent z-10"></div>
                    <div className="absolute top-2 right-2 z-20 bg-black/60 backdrop-blur-md px-2 py-0.5 rounded-full text-[10px] font-bold text-[#FF6847] flex items-center gap-1">
                      <IconStar /> {m.vote_average ? m.vote_average.toFixed(1) : '7.5'}
                    </div>
                    <div className="relative z-20">
                      <h3 className="text-sm font-bold text-white line-clamp-1 group-hover:text-[#FF6847] transition-colors">{m.title}</h3>
                      <p className="text-[11px] text-gray-400 mt-0.5">{m.release_year || '2023'}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>

          </div>

        </div>
      );
    }

    // --- Component: Movie Detail Page (Image1.webp Layout) ---
    function MovieDetailPage({ movie, allMovies, onSelectMovie }) {
      if (!movie) return null;

      const similarMovies = useMemo(() => {
        const mainGenre = (movie.genres || [])[0];
        return allMovies
          .filter(m => m.movie_id !== movie.movie_id && (m.genres || []).includes(mainGenre))
          .sort((a, b) => (b.popularity_score || 0) - (a.popularity_score || 0))
          .slice(0, 5)
          .map(m => ({
            name: (m.title || '').substring(0, 16),
            popularity: parseFloat((m.popularity_score || 10).toFixed(1)),
            raw: m
          }));
      }, [movie, allMovies]);

      const rev = movie.revenue_worldwide_usd;
      const bud = movie.budget_usd;
      const diff = rev && bud ? rev - bud : null;
      const ratio = rev && bud ? (rev / bud).toFixed(2) : null;
      const score = movie.vote_average || 7.4;

      // Dummy cast data matching Image1.webp layout
      const cast = [
        { name: 'Jack Champion', img: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=200&auto=format&fit=crop' },
        { name: 'Oona Chaplin', img: 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?q=80&w=200&auto=format&fit=crop' },
        { name: 'Sam Worthington', img: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=200&auto=format&fit=crop' },
        { name: 'Sigourney Weaver', img: 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=200&auto=format&fit=crop' },
        { name: 'Stephen Lang', img: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=200&auto=format&fit=crop' },
        { name: 'Zoe Saldaña', img: 'https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?q=80&w=200&auto=format&fit=crop' }
      ];

      return (
        <div className="flex h-full gap-6 animate-in fade-in duration-500 overflow-y-auto">
          
          {/* Left Column: Selector, Poster & 4 KPI Cards */}
          <div className="w-[28%] flex flex-col gap-4">
            
            {/* Movie Dropdown Selector */}
            <select 
              value={movie.movie_id} 
              onChange={(e) => {
                const selected = allMovies.find(m => m.movie_id === e.target.value);
                if (selected) onSelectMovie(selected);
              }}
              className="glass-card w-full p-3 rounded-xl text-xs font-semibold text-white outline-none appearance-none cursor-pointer border border-white/20 focus:border-[#FF6847]"
            >
              {allMovies.map(m => (
                <option key={m.movie_id} value={m.movie_id} className="bg-gray-900 text-white">
                  {m.title}
                </option>
              ))}
            </select>

            {/* Poster Card */}
            <div className="w-full aspect-[2/3] glass-panel rounded-vision overflow-hidden relative flex items-center justify-center shadow-2xl border border-white/15">
              <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent z-10"></div>
              <div className="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=1925&auto=format&fit=crop')] bg-cover bg-center opacity-60"></div>
              <span className="text-white font-extrabold text-2xl tracking-widest z-20 text-center px-4 drop-shadow-lg">
                {movie.title}
              </span>
            </div>

            {/* 4 KPI Grid Cards (Votes, Popularity, Duration, Year) */}
            <div className="grid grid-cols-2 gap-3">
              <div className="glass-card p-3 rounded-xl flex flex-col items-center justify-center text-center">
                <span className="text-[10px] text-gray-400 uppercase tracking-widest mb-1">Votes</span>
                <span className="text-lg font-bold">{formatNumber(movie.vote_count || 1453)}</span>
              </div>
              <div className="glass-card p-3 rounded-xl flex flex-col items-center justify-center text-center">
                <span className="text-[10px] text-gray-400 uppercase tracking-widest mb-1">Popularity</span>
                <span className="text-lg font-bold text-[#FF6847]">{(movie.popularity_score || 282.27).toFixed(1)}</span>
              </div>
              <div className="glass-card p-3 rounded-xl flex flex-col items-center justify-center text-center">
                <span className="text-[10px] text-gray-400 uppercase tracking-widest mb-1">Duration</span>
                <span className="text-lg font-bold">{movie.runtime_minutes || 198} min.</span>
              </div>
              <div className="glass-card p-3 rounded-xl flex flex-col items-center justify-center text-center">
                <span className="text-[10px] text-gray-400 uppercase tracking-widest mb-1">Year</span>
                <span className="text-lg font-bold">{movie.release_year || '2025'}</span>
              </div>
            </div>

          </div>

          {/* Middle Area: Cast, Overview, Similar Movies Horizontal Bar Chart */}
          <div className="w-[47%] flex flex-col gap-4">
            
            {/* Top Cast Avatars Row */}
            <div>
              <span className="text-[10px] text-gray-400 uppercase tracking-widest block mb-2 font-semibold">Top Cast</span>
              <div className="flex items-center gap-3 overflow-x-auto pb-1">
                {cast.map((c, i) => (
                  <div key={i} className="flex flex-col items-center gap-1 min-w-[64px]">
                    <img src={c.img} alt={c.name} className="w-12 h-12 rounded-xl object-cover border border-white/20 shadow-md" />
                    <span className="text-[9px] text-gray-300 text-center line-clamp-1">{c.name}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Overview Card */}
            <div className="glass-card p-5 rounded-vision">
              <span className="text-[10px] text-gray-400 uppercase tracking-widest block mb-2 font-semibold">Overview</span>
              <p className="text-xs leading-relaxed text-gray-200">
                {movie.overview || "In the wake of the devastating war against the RDA, Jake Sully and Neytiri face a new threat on Pandora..."}
              </p>
            </div>

            {/* Similar Movies Popularity Comparison (Horizontal Bar Chart) */}
            <div className="glass-card p-5 rounded-vision flex-1 flex flex-col min-h-[220px]">
              <span className="text-[10px] text-gray-400 uppercase tracking-widest block mb-1 font-semibold">Similar Movies</span>
              <span className="text-[9px] text-gray-500 uppercase tracking-wider block mb-3">Popularity Comparison</span>
              
              <div className="flex-1 w-full">
                {window.Recharts && similarMovies.length > 0 && (
                  <ResponsiveContainer width="100%" height="100%">
                    <BarChart data={similarMovies} layout="vertical" margin={{ top: 0, right: 30, left: 0, bottom: 0 }}>
                      <XAxis type="number" hide />
                      <YAxis dataKey="name" type="category" axisLine={false} tickLine={false} tick={{ fill: '#a0a0a5', fontSize: 10 }} width={100} />
                      <Tooltip cursor={{ fill: 'rgba(255,255,255,0.05)' }} contentStyle={{ background: 'rgba(15,15,17,0.95)', border: '1px solid rgba(255,104,71,0.4)', borderRadius: '8px', fontSize: '11px' }} />
                      <Bar 
                        dataKey="popularity" 
                        fill="#FF6847" 
                        radius={[0, 4, 4, 0]} 
                        barSize={14} 
                        onClick={(data) => data.raw && onSelectMovie(data.raw)}
                        style={{ cursor: 'pointer' }}
                      />
                    </BarChart>
                  </ResponsiveContainer>
                )}
              </div>
            </div>

          </div>

          {/* Right Column: Financials & TMDB Score Donut Chart */}
          <div className="w-[25%] flex flex-col gap-4">
            
            {/* Financials Card */}
            <div className="glass-card p-5 rounded-vision flex flex-col justify-between gap-4">
              <span className="text-[10px] text-gray-400 uppercase tracking-widest block font-semibold">Financials</span>
              
              <div className="flex flex-col gap-3">
                <div className="flex items-center gap-3">
                  <div className="w-9 h-9 rounded-xl bg-amber-500/20 border border-amber-500/30 flex items-center justify-center text-amber-400 text-base">💰</div>
                  <div>
                    <span className="text-[9px] text-gray-400 uppercase tracking-wider block">Budget</span>
                    <span className="text-base font-extrabold text-white">{formatMoney(bud)}</span>
                  </div>
                </div>

                <div className="flex items-center gap-3">
                  <div className="w-9 h-9 rounded-xl bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-base">📈</div>
                  <div>
                    <span className="text-[9px] text-gray-400 uppercase tracking-wider block">Revenue</span>
                    <span className="text-base font-extrabold text-emerald-400">{formatMoney(rev)}</span>
                  </div>
                </div>
              </div>

              {/* Strict BRD Compliance: "ส่วนต่างรายได้กับงบผลิต" & "Revenue-to-Budget Ratio" ONLY */}
              <div className="border-t border-white/10 pt-3 flex flex-col gap-1.5 text-xs">
                <div className="flex justify-between items-center">
                  <span className="text-[10px] text-gray-400">ส่วนต่างรายได้กับงบผลิต:</span>
                  <span className="font-semibold text-white">{formatMoney(diff)}</span>
                </div>
                <div className="flex justify-between items-center">
                  <span className="text-[10px] text-gray-400">Ratio:</span>
                  <span className="font-semibold text-[#FF6847]">{ratio ? `${ratio}x` : 'N/A'}</span>
                </div>
              </div>
            </div>

            {/* TMDB Score Card (Donut Chart matching Image1.webp) */}
            <div className="glass-card p-5 rounded-vision flex-1 flex flex-col items-center justify-center relative min-h-[220px]">
              <span className="text-[10px] text-gray-400 uppercase tracking-widest absolute top-4 left-4 font-semibold">TMDB Score</span>
              
              <div className="w-full h-full pt-4">
                {window.Recharts && (
                  <ResponsiveContainer width="100%" height="100%">
                    <PieChart>
                      <Pie 
                        data={[
                          { name: 'Score', value: score }, 
                          { name: 'Remaining', value: 10 - score }
                        ]} 
                        cx="50%" 
                        cy="50%" 
                        innerRadius="65%" 
                        outerRadius="85%" 
                        startAngle={90} 
                        endAngle={-270} 
                        dataKey="value" 
                        stroke="none"
                      >
                        <Cell fill="#FF6847" />
                        <Cell fill="rgba(255,255,255,0.08)" />
                        <Label 
                          value={score.toFixed(1).replace('.', ',')} 
                          position="center" 
                          fill="#ffffff" 
                          style={{ fontSize: '2.2rem', fontWeight: '800' }} 
                        />
                      </Pie>
                    </PieChart>
                  </ResponsiveContainer>
                )}
              </div>
            </div>

          </div>

        </div>
      );
    }

    // Render Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
